<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | LinkedIn Content Studio</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172b4d;background:#f3f6f8}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    .panel{width:min(100%,420px);background:#fff;border:1px solid #e2e8ee;border-radius:16px;padding:36px;box-shadow:0 18px 50px rgba(20,45,70,.09)}
    .brand{display:flex;align-items:center;gap:10px;margin-bottom:30px;color:#0a66c2;font-weight:750;font-size:18px}
    .logo{display:grid;place-items:center;width:34px;height:34px;border-radius:7px;background:#0a66c2;color:#fff;font-weight:800;font-size:22px}
    h1{font-size:25px;letter-spacing:-.5px;margin:0 0 8px}p{color:#64748b;margin:0 0 26px;font-size:14px}
    label{display:block;font-size:13px;font-weight:650;margin:17px 0 7px}
    input{width:100%;height:46px;border:1px solid #cbd5e1;border-radius:8px;padding:0 13px;font-size:15px;outline:none}
    input:focus{border-color:#0a66c2;box-shadow:0 0 0 3px rgba(10,102,194,.12)}
    button{width:100%;height:47px;margin-top:24px;border:0;border-radius:8px;background:#0a66c2;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
    button:hover{background:#004182}.error{background:#fff1f0;color:#b42318;border:1px solid #fecdca;padding:10px 12px;border-radius:8px;font-size:13px;margin:0 0 14px}
    .foot{text-align:center;font-size:12px;color:#94a3b8;margin:22px 0 0}
  </style>
</head>
<body>
  <main class="panel">
    <div class="brand"><span class="logo">in</span><span>Content Studio</span></div>
    <h1>Welcome back</h1>
    <p>Sign in to access your private workspace.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login" autocomplete="on">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
    <div class="foot">Private access · Secure session</div>
  </main>
</body>
</html>
